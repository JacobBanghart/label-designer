# Label Designer is a pure client-side single-page app: no backend, no API
# routes to proxy. This config only needs to (1) serve static files,
# (2) fall back unknown paths to index.html for client-side routing, and
# (3) set cache/security headers sanely for a static bundle.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx quirk: `add_header` does NOT inherit from an outer block into a
    # location block that sets its own `add_header` -- it replaces the whole
    # set for that location, not just the directives it repeats. So these
    # security headers are duplicated into every location below rather than
    # declared once at server level, or they'd silently vanish on the
    # /assets/ and /index.html responses that set Cache-Control.
    #
    # No inline-script/eval needs beyond what Vite's build emits, and the
    # app makes no network calls of its own -- connect-src 'self' is enough
    # since everything is bundled and local.

    # Vite fingerprints build assets (e.g. assets/index-<hash>.js), so they
    # are safe to cache forever -- a content change always yields a new URL.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html references the hashed assets, so it must never be cached --
    # otherwise browsers keep serving a stale index pointing at deleted
    # bundle files after a deploy.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA fallback: any path that isn't a real file falls back to index.html
    # so client-side routing (and plain page refreshes) keep working.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
